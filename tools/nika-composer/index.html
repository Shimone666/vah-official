<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nika Composer — Public Demo | Nika VAH</title>
  <meta name="description" content="Public demo of Nika Composer: lyric grid, section tags, and Suno-ready export for Nika VAH virtual idol production." />
  <meta name="author" content="Nika VAH" />
  <style>
    :root {
      --bg: #0d0f14; --panel: #161a22; --border: #2a3140;
      --text: #e8ecf4; --muted: #8b95a8; --accent: #7c9cff; --accent2: #5eead4;
      --mono: "SF Mono", Consolas, Menlo, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100vh; }
    header {
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;
      background: var(--panel); position: sticky; top: 0; z-index: 10;
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 0.8rem; }
    .badge {
      font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px;
      background: #1e293b; color: var(--accent2); border: 1px solid var(--border);
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    button {
      font: inherit; font-size: 0.8rem; padding: 0.4rem 0.7rem; border-radius: 8px;
      border: 1px solid var(--border); background: #1e2430; color: var(--text); cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: linear-gradient(135deg, #3b5bdb, #5c7cfa); border-color: transparent; color: #fff; }
    main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 64px); }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    aside { border-right: 1px solid var(--border); padding: 1rem; background: var(--panel); }
    aside label {
      display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin: 0.75rem 0 0.3rem;
    }
    aside label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%; font: inherit; font-size: 0.9rem; padding: 0.45rem 0.55rem;
      border-radius: 8px; border: 1px solid var(--border); background: #0f1218; color: var(--text);
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; }
    .workspace { padding: 1rem 1.25rem 2rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 720px; }
    th {
      text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--border);
      color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase;
    }
    td { padding: 0.3rem 0.35rem; border-bottom: 1px solid #1c2230; vertical-align: middle; }
    td input, td select { width: 100%; min-width: 0; padding: 0.35rem 0.4rem; font-size: 0.8rem; }
    .exports { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.25rem; }
    @media (max-width: 800px) { .exports { grid-template-columns: 1fr; } }
    .export-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem;
    }
    .export-box h3 { margin: 0 0 0.5rem; font-size: 0.85rem; }
    .export-box textarea {
      min-height: 160px; font-family: var(--mono); font-size: 0.75rem; resize: vertical;
    }
    footer {
      padding: 0.75rem 1.25rem; border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 1rem;
    }
    footer a { color: var(--accent); }
    .actions { display: flex; gap: 0.25rem; }
    .actions button { padding: 0.25rem 0.4rem; font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Nika Composer <span class="badge">public demo</span></h1>
      <div class="sub">Lyric grid · section tags · Suno export — Nika VAH (no production data)</div>
    </div>
    <div class="toolbar">
      <button type="button" onclick="addLine()">+ Line</button>
      <button type="button" class="primary" onclick="exportAll()">Refresh export</button>
      <button type="button" onclick="importLyrics(true)">Reset from paste</button>
    </div>
  </header>

  <main>
    <aside>
      <label>Title / concept</label>
      <input id="title" placeholder="Song title" value="Demo track" />

      <label>BPM</label>
      <input id="bpm" type="number" min="40" max="240" value="120" />

      <label>Style (Suno)</label>
      <textarea id="style" rows="4">synthpop, 120 BPM, female vocal, clean mix, emotional but bright</textarea>

      <label>Default duration slot</label>
      <select id="defaultDur">
        <option value="4">4s</option>
        <option value="6">6s</option>
        <option value="8" selected>8s</option>
        <option value="10">10s</option>
      </select>

      <label>Default section</label>
      <select id="defaultSection">
        <option>Intro</option>
        <option selected>Verse</option>
        <option>Pre-Chorus</option>
        <option>Chorus</option>
        <option>Bridge</option>
        <option>Outro</option>
      </select>

      <label>Paste lyrics (raw)</label>
      <textarea id="pasteLyrics" rows="5" placeholder="one line = one lyric row"></textarea>
      <p class="hint">Public demo only. No account, no API keys, data stays in your browser.</p>
    </aside>

    <div class="workspace">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Slot (s)</th>
            <th>Section</th>
            <th>Chord</th>
            <th>Lyric</th>
            <th>Prompt</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="exports">
        <div class="export-box">
          <h3>Suno Lyrics</h3>
          <textarea id="outSuno" readonly></textarea>
          <button type="button" style="margin-top:0.5rem" onclick="copyText('outSuno')">Copy</button>
        </div>
        <div class="export-box">
          <h3>Suno Style</h3>
          <textarea id="outStyle" readonly></textarea>
          <button type="button" style="margin-top:0.5rem" onclick="copyText('outStyle')">Copy</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>Nika VAH · public tool demo</span>
    <a href="privacy.html">Privacy Policy</a>
    <a href="https://github.com/Shimone666/vah-official">GitHub</a>
    <a href="https://x.com/Nika_vah">@Nika_vah</a>
  </footer>

  <script>
    let lines = [];

    function defaultLine() {
      return {
        id: crypto.randomUUID(),
        duration_s: Number(document.getElementById("defaultDur").value) || 8,
        section: document.getElementById("defaultSection").value,
        chord: "",
        lyric: "",
        prompt: "",
      };
    }

    function addLine(prefill) {
      lines.push(Object.assign(defaultLine(), prefill || {}));
      render();
      exportAll();
    }

    function removeLine(id) {
      lines = lines.filter((l) => l.id !== id);
      render();
      exportAll();
    }

    function updateField(id, field, value) {
      const row = lines.find((l) => l.id === id);
      if (!row) return;
      if (field === "duration_s") {
        let d = parseFloat(value);
        if (!isFinite(d) || d < 1) d = 1;
        row.duration_s = d;
      } else {
        row[field] = value;
      }
      render();
      exportAll();
    }

    function escapeAttr(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function render() {
      const tb = document.getElementById("tbody");
      tb.innerHTML = "";
      lines.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><input type="number" min="1" step="1" value="${row.duration_s}"
            onchange="updateField('${row.id}','duration_s',this.value)" style="width:64px" /></td>
          <td>
            <select onchange="updateField('${row.id}','section',this.value)">
              ${["Intro","Verse","Pre-Chorus","Chorus","Bridge","Outro"]
                .map((s) => `<option value="${s}" ${s === row.section ? "selected" : ""}>${s}</option>`)
                .join("")}
            </select>
          </td>
          <td><input value="${escapeAttr(row.chord)}" placeholder="Am"
            onchange="updateField('${row.id}','chord',this.value)" style="width:64px;text-align:center" /></td>
          <td><input value="${escapeAttr(row.lyric)}" placeholder="lyric line"
            onchange="updateField('${row.id}','lyric',this.value)" /></td>
          <td><input value="${escapeAttr(row.prompt)}" placeholder="instrument cue"
            onchange="updateField('${row.id}','prompt',this.value)" /></td>
          <td class="actions">
            <button type="button" onclick="removeLine('${row.id}')">×</button>
          </td>`;
        tb.appendChild(tr);
      });
    }

    function importLyrics(replaceAll) {
      const raw = document.getElementById("pasteLyrics").value || "";
      const parts = raw.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      if (!parts.length) return;
      if (replaceAll) lines = [];
      parts.forEach((lyric) => addLine({ lyric }));
      document.getElementById("pasteLyrics").value = "";
    }

    function exportAll() {
      const bpm = document.getElementById("bpm").value || "120";
      let style = (document.getElementById("style").value || "").trim();
      if (style && !/\bBPM\b/i.test(style)) style = style.replace(/,?\s*$/, "") + `, ${bpm} BPM`;
      document.getElementById("outStyle").value = style;

      let suno = "";
      let last = null;
      lines.forEach((row) => {
        if (row.section !== last) {
          suno += `\n[${row.section}]\n`;
          last = row.section;
        }
        const chord = (row.chord || "").trim();
        const prompt = (row.prompt || "").trim();
        suno += `[${chord}][${prompt}]\n`;
        if (row.lyric) suno += row.lyric + "\n";
        else suno += "\n";
      });
      document.getElementById("outSuno").value = suno.trim() + "\n";
    }

    function copyText(id) {
      const el = document.getElementById(id);
      navigator.clipboard.writeText(el.value || "").catch(() => {
        el.select();
        document.execCommand("copy");
      });
    }

    lines = [
      { id: crypto.randomUUID(), duration_s: 8, section: "Intro", chord: "", lyric: "oh", prompt: "pad rise" },
      { id: crypto.randomUUID(), duration_s: 4, section: "Verse", chord: "Am", lyric: "we're still here", prompt: "soft drums" },
      { id: crypto.randomUUID(), duration_s: 4, section: "Verse", chord: "F", lyric: "in the neon rain", prompt: "bass under" },
      { id: crypto.randomUUID(), duration_s: 8, section: "Chorus", chord: "C", lyric: "don't let the light go out", prompt: "full band" },
    ];
    render();
    exportAll();
  </script>
</body>
</html>
