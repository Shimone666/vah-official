<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webtoon dummy — Veta | VAH Official</title>
<meta name="description" content="Empty panel board for Veta. One color. Day or night. No draft story.">
<style>
  :root { --c:#2f6b4f; }
  body[data-mode="day"] { --bg:#f4f7f5; --card:#fff; --text:#163028; --muted:#5d7368; --line:#d5e3db; --field:#fff; }
  body[data-mode="night"] { --bg:#101614; --card:#18211c; --text:#e7f3ec; --muted:#9bb3a6; --line:#2c4036; --field:#101614; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header, footer { padding:.9rem 1.1rem; background:var(--card); border-bottom:3px solid var(--c); }
  footer { border-bottom:0; border-top:3px solid var(--c); color:var(--muted); font-size:.75rem; }
  h1 { margin:0; font-size:1.15rem; color:var(--c); }
  .sub { color:var(--muted); font-size:.78rem; }
  a { color:var(--c); }
  main { padding:1rem 1.1rem 2rem; }
  .bar, .row { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
  .bar { margin-bottom:1rem; }
  label { color:var(--muted); font-size:.75rem; display:flex; gap:.35rem; align-items:center; }
  button, select, input[type="number"] { font:inherit; font-size:.82rem; color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:.35rem .6rem; }
  button { cursor:pointer; }
  button.solid { background:var(--c); color:#fff; border-color:var(--c); }
  .board { display:grid; gap:.7rem; }
  .board.cols-1 { grid-template-columns:minmax(0,440px); }
  .board.cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .board.cols-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  @media (max-width:720px) { .board.cols-2, .board.cols-3 { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c); border-radius:12px; padding:.55rem; display:flex; flex-direction:column; gap:.4rem; }
  .slot { min-height:var(--h,180px); border:1px dashed var(--c); border-radius:8px; display:grid; place-items:center; overflow:hidden; background:var(--field); color:var(--muted); font-size:.78rem; text-align:center; }
  .slot img { width:100%; height:var(--h,180px); object-fit:contain; }
  input[type="text"] { flex:1; min-width:8rem; font:inherit; font-size:.82rem; padding:.35rem .5rem; border-radius:8px; border:1px solid var(--line); background:var(--field); color:var(--text); }
  .hide-notes input[type="text"] { display:none; }
</style>
</head>
<body data-mode="night">
<header>
  <h1>Veta · Webtoon dummy</h1>
  <div class="sub">One color. Empty panels. Shift, note, attach a photo. Nothing leaves this browser.</div>
  <p><a href="../../veta-panelling.html">Veta page</a> · <a href="../../index.html">VAH Official</a></p>
</header>
<main>
  <div class="bar">
    <label>Mode
      <select id="mode"><option value="day">Day</option><option value="night" selected>Night</option></select>
    </label>
    <label>Columns
      <select id="cols"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
    </label>
    <label>Panel height
      <select id="height"><option value="140">Short</option><option value="180" selected>Medium</option><option value="280">Tall</option></select>
    </label>
    <label>Notes <input type="checkbox" id="notes" checked></label>
    <button class="solid" type="button" id="add">Add empty panel</button>
    <button type="button" id="clearNotes">Clear notes</button>
  </div>
  <div class="board cols-2" id="board"></div>
</main>
<footer>Tool only. Not webtoon lore. Photos are not uploaded.</footer>
<script>
const board = document.getElementById("board");
const root = document.body;
let panels = [];
function blank(){ return { note:"", url:"" }; }
function saveSet(){
  localStorage.setItem("veta-dummy", JSON.stringify({
    mode: root.dataset.mode,
    cols: document.getElementById("cols").value,
    height: document.getElementById("height").value,
    notes: document.getElementById("notes").checked
  }));
}
function applySet(){
  board.className = "board cols-" + document.getElementById("cols").value;
  board.style.setProperty("--h", document.getElementById("height").value + "px");
  board.classList.toggle("hide-notes", !document.getElementById("notes").checked);
  saveSet();
}
function paint(){
  board.innerHTML = "";
  panels.forEach((p,i) => {
    const card = document.createElement("article");
    card.className = "card";
    const slot = document.createElement("div");
    slot.className = "slot";
    if (p.url) {
      const img = document.createElement("img");
      img.alt = "panel " + (i+1);
      img.src = p.url;
      slot.appendChild(img);
    } else slot.textContent = "Panel " + (i+1) + " · empty";
    const file = document.createElement("input");
    file.type = "file"; file.accept = "image/*";
    file.addEventListener("change", () => {
      const f = file.files && file.files[0];
      if (!f) return;
      if (p.url) URL.revokeObjectURL(p.url);
      p.url = URL.createObjectURL(f);
      paint();
    });
    const note = document.createElement("input");
    note.type = "text"; note.placeholder = "note, optional"; note.value = p.note;
    note.addEventListener("input", () => { p.note = note.value; });
    const row = document.createElement("div");
    row.className = "row";
    function btn(label, fn){
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.addEventListener("click", fn); return b;
    }
    row.append(file,
      btn("Up", () => move(i,-1)),
      btn("Down", () => move(i,1)),
      btn("Clear photo", () => { if (p.url) URL.revokeObjectURL(p.url); p.url=""; paint(); }),
      btn("Remove", () => { if (p.url) URL.revokeObjectURL(p.url); panels.splice(i,1); paint(); })
    );
    card.append(slot, note, row);
    board.appendChild(card);
  });
}
function move(i,d){
  const j = i+d;
  if (j<0 || j>=panels.length) return;
  [panels[i], panels[j]] = [panels[j], panels[i]];
  paint();
}
document.getElementById("mode").addEventListener("change", e => { root.dataset.mode = e.target.value; saveSet(); });
["cols","height","notes"].forEach(id => document.getElementById(id).addEventListener("change", applySet));
document.getElementById("add").addEventListener("click", () => { panels.push(blank()); paint(); });
document.getElementById("clearNotes").addEventListener("click", () => { panels.forEach(p => p.note=""); paint(); });
try {
  const s = JSON.parse(localStorage.getItem("veta-dummy") || "null");
  if (s) {
    root.dataset.mode = s.mode || "night";
    document.getElementById("mode").value = root.dataset.mode;
    document.getElementById("cols").value = s.cols || "2";
    document.getElementById("height").value = s.height || "180";
    document.getElementById("notes").checked = s.notes !== false;
  }
} catch (e) {}
applySet();
for (let n=0;n<4;n++) panels.push(blank());
paint();
</script>
</body>
</html>
