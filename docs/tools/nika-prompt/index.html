<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nika prompt | VAH Official</title>
<meta name="description" content="Simple prompt fill for Nika. One color. Day or night. No sample song.">
<style>
  :root { --c:#2a4f8f; }
  body[data-mode="day"] { --bg:#f3f6fb; --card:#fff; --text:#15233d; --muted:#5c6b86; --line:#d5deee; --field:#fff; }
  body[data-mode="night"] { --bg:#0e1420; --card:#162033; --text:#e8eef8; --muted:#9aabc4; --line:#2c3d5c; --field:#0e1420; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header, footer { padding:.9rem 1.1rem; background:var(--card); border-bottom:3px solid var(--c); }
  footer { border-bottom:0; border-top:3px solid var(--c); color:var(--muted); font-size:.75rem; }
  h1 { margin:0; font-size:1.15rem; color:var(--c); }
  .sub { color:var(--muted); font-size:.78rem; }
  a { color:var(--c); }
  main { max-width:680px; padding:1rem 1.1rem 2rem; display:grid; gap:.7rem; }
  .bar { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
  label { display:grid; gap:.25rem; font-size:.75rem; color:var(--muted); }
  label.inline { display:flex; gap:.35rem; align-items:center; }
  input, select, textarea, button { font:inherit; font-size:.9rem; color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:.45rem .55rem; }
  button { cursor:pointer; background:var(--c); color:#fff; border-color:var(--c); width:max-content; }
  textarea { min-height:140px; }
</style>
</head>
<body data-mode="night">
<header>
  <h1>Nika · Prompt</h1>
  <div class="sub">One color. The prompt is filled from what you type. No sample song.</div>
  <p><a href="../../nika-komposer.html">Nika page</a> · <a href="../../index.html">VAH Official</a></p>
</header>
<main>
  <div class="bar">
    <label class="inline">Mode
      <select id="mode"><option value="day">Day</option><option value="night" selected>Night</option></select>
    </label>
    <label class="inline">Join with
      <select id="sep"><option value=", ">Comma</option><option value=" | ">Bar</option><option value="\n">New line</option></select>
    </label>
    <label class="inline">Style first <input type="checkbox" id="styleFirst"></label>
  </div>
  <label>Style <input id="style" placeholder="synthpop, clean mix"></label>
  <label>Section
    <select id="section"><option>Intro</option><option>Verse</option><option>Pre-Chorus</option><option>Chorus</option><option>Bridge</option><option>Outro</option></select>
  </label>
  <label>Chord <input id="chord" placeholder="optional"></label>
  <label>Lyric line <input id="lyric" placeholder="leave blank for instrumental"></label>
  <button type="button" id="go">Fill prompt</button>
  <label>Prompt <textarea id="out" readonly></textarea></label>
</main>
<footer>Not a release. Nothing is saved on a server.</footer>
<script>
const root = document.body;
function saveSet(){
  localStorage.setItem("nika-prompt", JSON.stringify({
    mode: root.dataset.mode,
    sep: document.getElementById("sep").value,
    styleFirst: document.getElementById("styleFirst").checked
  }));
}
document.getElementById("mode").addEventListener("change", e => { root.dataset.mode = e.target.value; saveSet(); });
document.getElementById("sep").addEventListener("change", saveSet);
document.getElementById("styleFirst").addEventListener("change", saveSet);
try {
  const s = JSON.parse(localStorage.getItem("nika-prompt") || "null");
  if (s) {
    root.dataset.mode = s.mode || "night";
    document.getElementById("mode").value = root.dataset.mode;
    if (s.sep) document.getElementById("sep").value = s.sep;
    document.getElementById("styleFirst").checked = !!s.styleFirst;
  }
} catch (e) {}
document.getElementById("go").addEventListener("click", () => {
  const style = document.getElementById("style").value.trim() || "unspecified style";
  const section = document.getElementById("section").value;
  const chord = document.getElementById("chord").value.trim();
  const lyric = document.getElementById("lyric").value.trim();
  const body = [section];
  if (chord) body.push(chord);
  body.push(lyric ? "sung line" : "instrumental only");
  const bits = document.getElementById("styleFirst").checked ? [style, ...body] : [...body, style];
  const sep = document.getElementById("sep").value.replace("\\n", "\n");
  document.getElementById("out").value = bits.join(sep);
  saveSet();
});
</script>
</body>
</html>
