<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel QC — Ashrael | VAH Official</title>
<meta name="description" content="Panel JSON check. One color. Day or night. Runs in the browser. Nothing is uploaded.">
<style>
  :root { --c:#6b3d55; }
  body[data-mode="day"] { --bg:#f8f4f6; --card:#fff; --text:#2c1822; --muted:#7a6570; --line:#eadde3; --field:#fff; --ok:#1f7a45; --warn:#8a5a10; --bad:#a12626; }
  body[data-mode="night"] { --bg:#140f12; --card:#241820; --text:#f6eef2; --muted:#c2aeb6; --line:#4a3340; --field:#140f12; --ok:#7dcea0; --warn:#e0b45c; --bad:#e07a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header, footer { padding:.9rem 1.1rem; background:var(--card); border-bottom:3px solid var(--c); }
  footer { border-bottom:0; border-top:3px solid var(--c); color:var(--muted); font-size:.75rem; }
  h1 { margin:0; font-size:1.15rem; color:var(--c); }
  .sub, header p { color:var(--muted); font-size:.8rem; }
  a { color:var(--c); }
  main { max-width:900px; margin:0 auto; padding:1rem 1.1rem 2.4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--c); margin:0 0 10px; }
  .bar { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:10px; }
  label.inline { display:flex; gap:.35rem; align-items:center; color:var(--muted); font-size:.75rem; }
  textarea { width:100%; min-height:180px; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:12px; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  button, select { font:inherit; border-radius:8px; padding:8px 14px; }
  button { background:var(--c); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  select { background:var(--field); color:var(--text); border:1px solid var(--line); }
  .drop { border:1px dashed var(--c); border-radius:8px; padding:14px; text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .drop.over { color:var(--c); }
  .verdict { padding:12px 14px; border-radius:8px; font-weight:600; margin-bottom:12px; }
  .verdict.ok { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .verdict.warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .verdict.bad { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .tag.ok { color:var(--ok); } .tag.warn { color:var(--warn); } .tag.bad { color:var(--bad); }
  ul.issues { margin:0; padding-left:18px; }
  .hidden { display:none; }
.langbar{display:inline-flex;gap:4px}.langbtn{font:600 11px/1 system-ui,sans-serif;padding:4px 7px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}.langbtn[aria-pressed=true]{color:var(--text);border-color:var(--c)}</style>
</head>
<body data-mode="night">
<header>
  <h1>Ashrael · Panel QC</h1>
  <p class="sub" data-i18n="ash_sub">One color. Checks panel JSON in this browser. Nothing is uploaded.</p>
  <p><a href="../index.html">VAH Official</a> · <a href="../nika-komposer/">Nika</a> · <a href="../veta-webtoon/">Veta</a> · <span class="langbar" data-langbar></span></p>
</header>
<main>
  <div class="card">
    <h2 data-i18n="ash_settings">Settings</h2>
    <div class="bar">
      <label class="inline">Mode
        <select id="mode"><option value="day">Day</option><option value="night" selected>Night</option></select>
      </label>
      <label class="inline">Empty dialogue
        <select id="emptyMode"><option value="warn" selected>Warning</option><option value="bad">Blocking</option></select>
      </label>
    </div>
    <h2 data-i18n="ash_input">Input</h2>
    <textarea id="input" data-i18n-placeholder="ash_ph" placeholder="Paste panel JSON. An array of panels, or a bundle with a chapters key."></textarea>
    <div class="row">
      <button id="check" data-i18n="ash_check">Check</button>
      <button class="ghost" id="clear" data-i18n="ash_clear">Clear</button>
      <button class="ghost" id="sample" data-i18n="ash_sample">Load sample</button>
      <button class="ghost" id="report" data-i18n="ash_report">Copy report</button>
    </div>
    <div class="drop" id="drop" data-i18n="ash_drop">or drop a .json file here</div>
  </div>
  <div class="card hidden" id="results">
    <h2 data-i18n="ash_result">Result</h2>
    <div class="verdict" id="verdict"></div>
    <table id="summary"></table>
    <div id="issues"></div>
  </div>
</main>
<footer>Panel QC on VAH Official. No network call. No storage of the file. Webtoon lore is not on this page.</footer>
<script src="../assets/i18n.js"></script>
<script>

"use strict";

const REQUIRED = ["persona_id"];

function normPanels(node, out, path) {
  if (Array.isArray(node)) {
    node.forEach((el, i) => normPanels(el, out, path + "[" + i + "]"));
    return;
  }
  if (node && typeof node === "object") {
    // bundle shapes
    if (node.chapters && typeof node.chapters === "object") {
      for (const [ch, panels] of Object.entries(node.chapters)) {
        normPanels(panels, out, ch);
      }
      return;
    }
    // a panel: has panel-ish keys
    const panelKeys = ["persona_id","panel","page","page_type","dialogue","text","lines","speaker","src","image"];
    if (panelKeys.some(k => k in node) || REQUIRED.every(k => k in node)) {
      node.__path = path;
      out.push(node);
      return;
    }
    // nested dict of pages/panels
    for (const [k, v] of Object.entries(node)) {
      normPanels(v, out, path + "." + k);
    }
  }
}

function check(input) {
  let data;
  try {
    data = JSON.parse(input);
  } catch (e) {
    return { fatal: "Not valid JSON: " + e.message };
  }
  const panels = [];
  normPanels(data, panels, "$");

  if (!panels.length) {
    return { fatal: "No panels found. Expected an array of panels, a chapter object, or a bundle with a 'chapters' key." };
  }

  const issues = [];
  const personae = {};
  const pages = {};
  let emptyDialogue = 0, missingRequired = 0;

  panels.forEach((p, i) => {
    const id = p.__path || ("#" + i);
    for (const req of REQUIRED) {
      if (!(req in p) || p[req] === null || p[req] === "") {
        issues.push({ sev: "bad", msg: id + ": missing '" + req + "'" });
        missingRequired++;
      }
    }
    const pid = p.persona_id;
    if (pid != null && pid !== "") {
      if (typeof pid === "object") {
        // persona_id as dict (new paneling format): value should name the persona
        const vals = Object.values(pid);
        if (!vals.length || vals.every(v => v == null || v === "")) {
          issues.push({ sev: "warn", msg: id + ": persona_id dict is empty" });
        } else {
          vals.forEach(v => personae[String(v)] = (personae[String(v)] || 0) + 1);
        }
      } else {
        personae[String(pid)] = (personae[String(pid)] || 0) + 1;
      }
    } else {
      personae["(missing)"] = (personae["(missing)"] || 0) + 1;
    }
    const page = (p.page != null) ? p.page : (p.page_type != null ? p.page_type : "?");
    const pKey = typeof page === "object" ? JSON.stringify(page) : String(page);
    pages[pKey] = (pages[pKey] || 0) + 1;
    // empty dialogue / text
    const textFields = ["dialogue","text","lines"];
    const hasText = textFields.some(f => f in p);
    if (hasText) {
      const t = p.dialogue || p.text || p.lines;
      const empty = t == null || t === "" ||
        (Array.isArray(t) && t.every(x => !x || !String(x).trim())) ||
        (typeof t === "object" && !Array.isArray(t) && Object.values(t).every(x => !x || !String(x).trim()));
      if (empty) { emptyDialogue++; issues.push({ sev: (window.QC_EMPTY_BLOCK ? "bad" : "warn"), msg: id + ": dialogue/text is empty" }); }
    }
    // unknown page_type
    if ("page_type" in p && p.page_type != null &&
        !["story","panel","cover","splash","end"].includes(String(p.page_type).toLowerCase())) {
      issues.push({ sev: "warn", msg: id + ": unknown page_type '" + p.page_type + "'" });
    }
  });

  const bad = issues.filter(x => x.sev === "bad").length;
  const warns = issues.filter(x => x.sev === "warn").length;

  return {
    total: panels.length,
    personae, pages,
    bad, warns, issues,
    emptyDialogue, missingRequired
  };
}

function render(r) {
  const box = document.getElementById("results");
  const verdict = document.getElementById("verdict");
  const summary = document.getElementById("summary");
  const issuesBox = document.getElementById("issues");
  box.classList.remove("hidden");

  if (r.fatal) {
    verdict.className = "verdict bad";
    verdict.textContent = "✕ " + r.fatal;
    summary.innerHTML = "";
    issuesBox.innerHTML = "";
    return;
  }
  let cls = "ok", msg = "✓ All " + r.total + " panels pass";
  if (r.bad > 0) { cls = "bad"; msg = "✕ " + r.bad + " blocking issue(s), " + r.warns + " warning(s) across " + r.total + " panels"; }
  else if (r.warns > 0) { cls = "warn"; msg = "△ " + r.warns + " warning(s) across " + r.total + " panels"; }
  verdict.className = "verdict " + cls;
  verdict.textContent = msg;

  const rows = [
    ["Panels", r.total],
    ["Personae (persona_id)", Object.entries(r.personae).map(([k,v]) => k + " ×" + v).join(", ") || "—"],
    ["Pages covered", Object.keys(r.pages).length],
    ["Empty dialogue", r.emptyDialogue],
    ["Missing required fields", r.missingRequired],
  ];
  summary.innerHTML = rows.map(([k,v]) => "<tr><th style='width:40%'>" + k + "</th><td>" + String(v).replace(/</g,"&lt;") + "</td></tr>").join("");

  if (r.issues.length) {
    issuesBox.innerHTML = "<h2 style='font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:14px 0 8px'>Issues (" + r.issues.length + ")</h2><ul class='issues'>" +
      r.issues.slice(0, 200).map(x =>
        "<li><span class='tag " + x.sev + "'>" + (x.sev === "bad" ? "BLOCK" : "WARN") + "</span> " + x.msg.replace(/</g,"&lt;") + "</li>"
      ).join("") + (r.issues.length > 200 ? "<li>… " + (r.issues.length - 200) + " more</li>" : "") + "</ul>";
  } else {
    issuesBox.innerHTML = "";
  }
}

document.getElementById("check").addEventListener("click", () => {
  lastReport = null;
  render(check(document.getElementById("input").value));
});
document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("input").value = "";
  document.getElementById("results").classList.add("hidden");
});
document.getElementById("sample").addEventListener("click", () => {
  document.getElementById("input").value = JSON.stringify({
    chapters: {
      "ch-01": [
        { persona_id: { veta: "mira" }, page: 1, page_type: "cover", dialogue: "The lamp still burns." },
        { persona_id: { veta: "kai" }, page: 1, page_type: "panel", dialogue: "Then let it." },
        { persona_id: "", page: 2, page_type: "panel", dialogue: "" },
        { page: 3, page_type: "panel", dialogue: "Who turned it off?" }
      ]
    }
  }, null, 2);
});

let lastReport = null;
document.getElementById("report").addEventListener("click", () => {
  const r = check(document.getElementById("input").value);
  let text;
  if (r.fatal) text = "Panel QC — FAIL: " + r.fatal;
  else {
    text = "Panel QC — " + (r.bad ? "FAIL" : r.warns ? "PASS with warnings" : "PASS") + "\n" +
      "Panels: " + r.total + "\nPersonae: " + JSON.stringify(r.personae) + "\n" +
      "Empty dialogue: " + r.emptyDialogue + "\nMissing required: " + r.missingRequired + "\n" +
      (r.issues.length ? "Issues:\n" + r.issues.map(x => "- [" + x.sev.toUpperCase() + "] " + x.msg).join("\n") : "No issues.");
  }
  navigator.clipboard.writeText(text).then(
    () => { document.getElementById("report").textContent = "Copied ✓"; setTimeout(() => document.getElementById("report").textContent = "Copy report", 1200); },
    () => { document.getElementById("input").select(); document.execCommand("copy"); }
  );
});

const drop = document.getElementById("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { document.getElementById("input").value = rd.result; document.getElementById("check").click(); };
  rd.readAsText(f);
});

document.getElementById("mode").addEventListener("change", e => {
  document.body.dataset.mode = e.target.value;
  localStorage.setItem("ashrael-qc-mode", e.target.value);
});
document.getElementById("emptyMode").addEventListener("change", e => {
  window.QC_EMPTY_BLOCK = e.target.value === "bad";
  localStorage.setItem("ashrael-qc-empty", e.target.value);
});
try {
  const m = localStorage.getItem("ashrael-qc-mode");
  if (m) { document.body.dataset.mode = m; document.getElementById("mode").value = m; }
  const em = localStorage.getItem("ashrael-qc-empty");
  if (em) { document.getElementById("emptyMode").value = em; window.QC_EMPTY_BLOCK = em === "bad"; }
} catch (e) {}
</script>
</body>
</html>
